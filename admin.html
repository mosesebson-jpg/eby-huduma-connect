
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBY MEDIA TZ | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5fb;color:#17243b}
header{background:#06345e;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;font-size:20px}
header small{color:#b9dafa}
button{cursor:pointer;border:0;border-radius:9px;padding:12px;font-weight:bold}
.logout{background:white;color:#07518d}
.login{max-width:420px;margin:50px auto;background:white;padding:25px;border-radius:16px;box-shadow:0 5px 25px #0001}
input,textarea,select{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ddd;border-radius:9px;font-size:15px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.primary{background:#07518d;color:white;width:100%;padding:15px}
.layout{display:none;max-width:1300px;margin:auto;padding:18px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
nav button{background:white;color:#07518d;border:1px solid #ddd}
nav button.active{background:#07518d;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.stat,.panel{background:white;padding:20px;border-radius:13px;box-shadow:0 3px 12px #0001}
.stat strong{display:block;font-size:28px;color:#07518d;margin-top:12px}
.stat small{color:#64748b}
.panel{margin-top:18px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:550px}
td,th{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{background:#edf4fb}
#message{color:#c0392b;font-size:14px}
.ad-form{max-width:700px;margin-bottom:25px}
.ad-form h3{color:#07518d}
.ad-actions{display:flex;gap:7px;flex-wrap:wrap}
.edit{background:#e5efff;color:#07518d}
.delete{background:#fee2e2;color:#b91c1c}
.status{background:#e0f2fe;color:#075985}
.cancel{background:#64748b;color:white}
.preview{width:65px;height:55px;object-fit:cover;border-radius:7px}
.notice{padding:12px;background:#edf4fb;border-radius:8px;margin:10px 0;color:#07518d}
.form-buttons{display:flex;gap:10px}
.form-buttons button{flex:1}
@media(max-width:600px){
.layout{padding:12px}
.login{margin:25px 12px}
.panel{padding:14px}
}
</style>
</head>

<body>

<header>
<div>
<h2>EBY MEDIA TZ</h2>
<small>Kisima cha Burudani | Admin Center</small>
</div>
<button class="logout" id="logout" hidden>Toka</button>
</header>

<section class="login" id="loginBox">
<h2>Admin Login</h2>
<p>Ingia kwenye mfumo wa usimamizi.</p>
<form id="loginForm">
<label>Barua pepe</label>
<input id="email" type="email" required placeholder="Admin email">
<label>Nenosiri</label>
<input id="password" type="password" required placeholder="Nenosiri">
<button class="primary" type="submit">INGIA ADMIN</button>
</form>
<p id="message"></p>
</section>

<main class="layout" id="dashboard">
<h2>Karibu EBY MEDIA TZ 👋</h2>
<p id="welcome">Admin Dashboard</p>

<nav id="navigation">
<button class="active" data-table="overview">Dashboard</button>
<button data-table="profiles">Wanachama</button>
<button data-table="advertisements">Matangazo</button>
<button data-table="businesses">Biashara</button>
<button data-table="community_groups">Vikundi</button>
<button data-table="jobs">Ajira</button>
<button data-table="products">Bidhaa</button>
<button data-table="services">Huduma</button>
<button data-table="service_inquiries">Maombi</button>
</nav>

<section id="overview">
<div class="grid" id="stats"></div>
<div class="panel">
<h3>EBY MEDIA TZ Control Center</h3>
<p>Simamia taarifa za mfumo wako hapa.</p>
</div>
</section>

<section id="records" style="display:none">
<div class="panel">
<h3 id="tableTitle"></h3>
<p id="loading"></p>
<div id="tableContent"></div>
</div>
</section>

<!-- ADVERTISEMENTS MANAGEMENT -->
<section id="adsSection" style="display:none">

<div class="panel ad-form">
<h2 id="adFormTitle">➕ Ongeza Tangazo Jipya</h2>
<p>Jaza taarifa za tangazo lako.</p>

<form id="adForm">

<label>Kichwa cha tangazo *</label>
<input id="adTitle" type="text" required
placeholder="Mfano: Tangazo la biashara">

<label>Maelezo ya tangazo</label>
<textarea id="adDescription"
placeholder="Andika maelezo ya tangazo..."></textarea>

<label>Link ya picha (Image URL)</label>
<input id="adImage" type="url"
placeholder="https://example.com/image.jpg">

<label>Link ya kuelekea (Target URL)</label>
<input id="adTarget" type="url"
placeholder="https://example.com">

<label>Tarehe ya kuanza</label>
<input id="adStart" type="date">

<label>Tarehe ya kumalizika</label>
<input id="adEnd" type="date">

<label>Hali ya tangazo</label>
<select id="adStatus">
<option value="active">Active</option>
<option value="pending">Pending</option>
<option value="paused">Paused</option>
</select>

<div class="form-buttons">
<button type="submit" class="primary" id="saveAd">
HIFADHI TANGAZO
</button>
<button type="button" class="cancel" id="cancelEdit" hidden>
GHAIRI
</button>
</div>

<p id="adMessage"></p>
</form>
</div>

<div class="panel">
<h2>📢 Matangazo Yaliyopo</h2>
<button class="edit" id="refreshAds">↻ Refresh</button>
<p id="adsLoading"></p>
<div id="adsList"></div>
</div>

</section>

</main>

<script>
const SUPABASE_URL =
"https://noruvqqesdzlwfijxerq.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable__3ThPNKCLJghRDsCCL_4ig_9ZfFUKHD";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const tables = {
profiles:"Wanachama",
advertisements:"Matangazo",
businesses:"Biashara",
community_groups:"Vikundi",
jobs:"Ajira",
products:"Bidhaa",
services:"Huduma",
service_inquiries:"Maombi ya huduma"
};

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const message=document.getElementById("message");

let checking=false;
let currentUser=null;
let editingAd=null;

function showLogin(){
loginBox.style.display="block";
dashboard.style.display="none";
document.getElementById("logout").hidden=true;
currentUser=null;
}

async function checkAdmin(session){
if(checking)return;
checking=true;

try{
if(!session){
showLogin();
return;
}

const {data,error}=await db
.from("profiles")
.select("id,full_name,role")
.eq("id",session.user.id)
.maybeSingle();

if(error || !data || data.role!=="admin"){
await db.auth.signOut();
showLogin();
message.textContent="Akaunti hii haina ruhusa za Admin.";
return;
}

currentUser=session.user;

loginBox.style.display="none";
dashboard.style.display="block";
document.getElementById("logout").hidden=false;

document.getElementById("welcome").textContent=
"Karibu "+(data.full_name||session.user.email);

await loadStats();

}catch(e){
showLogin();
message.textContent=e.message;
}finally{
checking=false;
}
}

document.getElementById("loginForm")
.addEventListener("submit",async(e)=>{
e.preventDefault();
message.textContent="Inakagua akaunti...";

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const {data,error}=await db.auth.signInWithPassword({
email,password
});

if(error){
message.textContent=error.message;
return;
}

await checkAdmin(data.session);
});

document.getElementById("logout").onclick=async()=>{
await db.auth.signOut();
showLogin();
};

async function loadStats(){
const stats=document.getElementById("stats");
stats.innerHTML="";

for(const [table,name] of Object.entries(tables)){
const {count,error}=await db
.from(table)
.select("*",{count:"exact",head:true});

const card=document.createElement("div");
card.className="stat";

const label=document.createElement("small");
label.textContent=name;

const number=document.createElement("strong");
number.textContent=error?"--":(count??0);

card.append(label,number);
stats.appendChild(card);
}
}

async function loadTable(table){
document.getElementById("overview").style.display="none";
document.getElementById("records").style.display="block";
document.getElementById("adsSection").style.display="none";

document.getElementById("tableTitle").textContent=tables[table];
document.getElementById("loading").textContent="Inapakia...";
document.getElementById("tableContent").innerHTML="";

const {data,error}=await db
.from(table)
.select("*")
.limit(50);

document.getElementById("loading").textContent="";

if(error){
document.getElementById("tableContent").textContent=
"Hitilafu: "+error.message;
return;
}

if(!data || data.length===0){
document.getElementById("tableContent").textContent=
"Hakuna taarifa zilizopatikana.";
return;
}

const t=document.createElement("table");
const head=document.createElement("tr");

Object.keys(data[0]).forEach(key=>{
const th=document.createElement("th");
th.textContent=key;
head.appendChild(th);
});

const thead=document.createElement("thead");
thead.appendChild(head);
t.appendChild(thead);

const tbody=document.createElement("tbody");

data.forEach(record=>{
const tr=document.createElement("tr");

Object.keys(record).forEach(key=>{
const td=document.createElement("td");
const value=record[key];

td.textContent=value===null?"-":
typeof value==="object"?JSON.stringify(value):String(value);

tr.appendChild(td);
});

tbody.appendChild(tr);
});

t.appendChild(tbody);
document.getElementById("tableContent").appendChild(t);
}

// -----------------------------
// ADVERTISEMENTS MANAGEMENT
// -----------------------------

const adForm=document.getElementById("adForm");
const adMessage=document.getElementById("adMessage");

function adMsg(text,color="#07518d"){
adMessage.textContent=text;
adMessage.style.color=color;
}

function resetAdForm(){
editingAd=null;
adForm.reset();

document.getElementById("adFormTitle").textContent=
"➕ Ongeza Tangazo Jipya";

document.getElementById("saveAd").textContent=
"HIFADHI TANGAZO";

document.getElementById("cancelEdit").hidden=true;
adMsg("");
}

async function loadAds(){
const list=document.getElementById("adsList");
const loading=document.getElementById("adsLoading");

list.innerHTML="";
loading.textContent="Inapakia matangazo...";

const {data,error}=await db
.from("advertisements")
.select("id,owner_id,title,description,image_url,target_url,status,start_date,end_date,created_at")
.order("created_at",{ascending:false})
.limit(100);

loading.textContent="";

if(error){
list.textContent="Hitilafu: "+error.message;
return;
}

if(!data || data.length===0){
list.textContent="Bado hakuna matangazo. Ongeza tangazo lako la kwanza.";
return;
}

const table=document.createElement("table");
const thead=document.createElement("thead");
const head=document.createElement("tr");

["Picha","Kichwa","Hali","Tarehe ya kuanza","Mwisho","Vitendo"]
.forEach(label=>{
const th=document.createElement("th");
th.textContent=label;
head.appendChild(th);
});

thead.appendChild(head);
table.appendChild(thead);

const tbody=document.createElement("tbody");

data.forEach(ad=>{
const tr=document.createElement("tr");

const imageCell=document.createElement("td");
if(ad.image_url){
const img=document.createElement("img");
img.src=ad.image_url;
img.alt=ad.title||"Tangazo";
img.className="preview";
img.loading="lazy";
imageCell.appendChild(img);
}else{
imageCell.textContent="-";
}
tr.appendChild(imageCell);

const titleCell=document.createElement("td");
titleCell.textContent=ad.title||"-";
tr.appendChild(titleCell);

const statusCell=document.createElement("td");
statusCell.textContent=ad.status||"-";
tr.appendChild(statusCell);

const startCell=document.createElement("td");
startCell.textContent=ad.start_date||"-";
tr.appendChild(startCell);

const endCell=document.createElement("td");
endCell.textContent=ad.end_date||"-";
tr.appendChild(endCell);

const actionCell=document.createElement("td");
actionCell.className="ad-actions";

const editBtn=document.createElement("button");
editBtn.className="edit";
editBtn.textContent="Hariri";
editBtn.addEventListener("click",()=>editAd(ad));

const deleteBtn=document.createElement("button");
deleteBtn.className="delete";
deleteBtn.textContent="Futa";
deleteBtn.addEventListener("click",()=>deleteAd(ad.id));

const statusBtn=document.createElement("button");
statusBtn.className="status";
statusBtn.textContent=
ad.status==="active"?"Simamisha":"Washa";

statusBtn.addEventListener("click",()=>toggleAd(ad));

actionCell.append(editBtn,deleteBtn,statusBtn);
tr.appendChild(actionCell);

tbody.appendChild(tr);
});

table.appendChild(tbody);
list.appendChild(table);
}

adForm.addEventListener("submit",async(e)=>{
e.preventDefault();

if(!currentUser){
adMsg("Ingia tena kwenye akaunti ya Admin.","#c0392b");
return;
}

const title=document.getElementById("adTitle").value.trim();
const description=document.getElementById("adDescription").value.trim();
const image_url=document.getElementById("adImage").value.trim();
const target_url=document.getElementById("adTarget").value.trim();
const start_date=document.getElementById("adStart").value||null;
const end_date=document.getElementById("adEnd").value||null;
const status=document.getElementById("adStatus").value;

if(!title){
adMsg("Tafadhali weka kichwa cha tangazo.","#c0392b");
return;
}

if(start_date && end_date && end_date<start_date){
adMsg("Tarehe ya mwisho haiwezi kuwa kabla ya tarehe ya kuanza.","#c0392b");
return;
}

const payload={
title,
description:description||null,
image_url:image_url||null,
target_url:target_url||null,
start_date,
end_date,
status
};

const saveBtn=document.getElementById("saveAd");
saveBtn.disabled=true;
saveBtn.textContent="Inahifadhi...";

try{
let result;

if(editingAd){
result=await db
.from("advertisements")
.update(payload)
.eq("id",editingAd);
}else{
result=await db
.from("advertisements")
.insert({
...payload,
owner_id:currentUser.id
});
}

if(result.error)throw result.error;

adMsg(
editingAd?"Tangazo limehaririwa kikamilifu!":"Tangazo limehifadhiwa kikamilifu!",
"#16803c"
);

resetAdForm();
await loadAds();
await loadStats();

}catch(error){
adMsg("Imeshindikana: "+error.message,"#c0392b");
}finally{
saveBtn.disabled=false;
saveBtn.textContent="HIFADHI TANGAZO";
}
});

function editAd(ad){
editingAd=ad.id;

document.getElementById("adTitle").value=ad.title||"";
document.getElementById("adDescription").value=ad.description||"";
document.getElementById("adImage").value=ad.image_url||"";
document.getElementById("adTarget").value=ad.target_url||"";
document.getElementById("adStart").value=ad.start_date||"";
document.getElementById("adEnd").value=ad.end_date||"";
document.getElementById("adStatus").value=ad.status||"active";

document.getElementById("adFormTitle").textContent=
"✏️ Hariri Tangazo";

document.getElementById("saveAd").textContent=
"HIFADHI MABADILIKO";

document.getElementById("cancelEdit").hidden=false;

adMsg("Unahariri tangazo lililochaguliwa.");
document.getElementById("adFormTitle").scrollIntoView({
behavior:"smooth",
block:"start"
});
}

async function deleteAd(id){
if(!confirm("Una uhakika unataka kufuta tangazo hili?"))return;

const {error}=await db
.from("advertisements")
.delete()
.eq("id",id);

if(error){
alert("Imeshindikana kufuta: "+error.message);
return;
}

alert("Tangazo limefutwa.");
await loadAds();
await loadStats();
}

async function toggleAd(ad){
const newStatus=ad.status==="active"?"paused":"active";

const {error}=await db
.from("advertisements")
.update({status:newStatus})
.eq("id",ad.id);

if(error){
alert("Imeshindikana kubadilisha hali: "+error.message);
return;
}

await loadAds();
await loadStats();
}

document.getElementById("cancelEdit").onclick=resetAdForm;

document.getElementById("refreshAds").onclick=loadAds;

// -----------------------------
// NAVIGATION
// -----------------------------

document.getElementById("navigation")
.addEventListener("click",async(e)=>{
const btn=e.target.closest("button");
if(!btn)return;

document.querySelectorAll("nav button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

const table=btn.dataset.table;

if(table==="overview"){
document.getElementById("overview").style.display="block";
document.getElementById("records").style.display="none";
document.getElementById("adsSection").style.display="none";
await loadStats();

}else if(table==="advertisements"){
document.getElementById("overview").style.display="none";
document.getElementById("records").style.display="none";
document.getElementById("adsSection").style.display="block";
resetAdForm();
await loadAds();

}else{
await loadTable(table);
}
});

// -----------------------------
// AUTH
// -----------------------------

db.auth.onAuthStateChange((event,session)=>{
if(event==="SIGNED_OUT"){
showLogin();
}
});

(async()=>{
const {data}=await db.auth.getSession();
await checkAdmin(data.session);
})();

</script>
</body>
</html>
